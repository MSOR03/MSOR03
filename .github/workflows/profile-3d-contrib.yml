name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC (03:00 in Bogotá)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contrib
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v5

      - name: Run 3D Contrib Action
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # The built-in token is enough for public contributions. To also count
          # private ones, replace it with a valid personal access token secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate 3D contribution calendar"
            git push
          fi
